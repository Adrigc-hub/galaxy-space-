<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cosmic Space OS</title>
  <link rel="manifest" href="manifest.json" />
  <style>
    :root {
      --bg-gradient: radial-gradient(circle at 50% 50%, #0f172a 0%, #020617 100%);
      --panel-bg: rgba(15, 23, 42, 0.75);
      --accent-cyan: #00f0ff;
      --accent-purple: #8b5cf6;
      --accent-pink: #ec4899;
      --text-main: #f8fafc;
      --text-dim: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      user-select: none;
    }

    body {
      background: var(--bg-gradient);
      background-size: cover;
      background-attachment: fixed;
      color: var(--text-main);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      transition: background 0.5s ease;
    }

    /* BARRA SUPERIOR */
    .top-bar {
      height: 60px;
      padding: 0 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(2, 6, 23, 0.85);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid rgba(0, 240, 255, 0.2);
      z-index: 10;
      flex-wrap: wrap;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 800;
      font-size: 16px;
      letter-spacing: 1px;
      color: var(--accent-cyan);
      text-shadow: 0 0 12px rgba(0, 240, 255, 0.6);
    }

    .nav-tabs {
      display: flex;
      gap: 6px;
      background: rgba(255, 255, 255, 0.05);
      padding: 4px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .tab-btn {
      background: transparent;
      color: var(--text-dim);
      border: none;
      padding: 6px 12px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.25s ease;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .tab-btn.active, .tab-btn:active {
      background: linear-gradient(135deg, var(--accent-cyan), var(--accent-purple));
      color: #ffffff;
      box-shadow: 0 0 12px rgba(0, 240, 255, 0.4);
    }

    /* CONTENEDOR VISTAS */
    .view-container {
      flex: 1;
      padding: 15px;
      position: relative;
      overflow-y: auto;
    }

    .view-section {
      display: none;
      height: 100%;
      width: 100%;
      animation: fadeIn 0.3s ease-out forwards;
    }

    .view-section.active {
      display: flex;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.98); }
      to { opacity: 1; transform: scale(1); }
    }

    /* GAMESPACE LAYOUT */
    .gamespace-layout {
      display: flex;
      gap: 15px;
      width: 100%;
      height: 100%;
    }

    @media (max-width: 650px) {
      .gamespace-layout {
        flex-direction: column;
      }
      .sidebar-games {
        width: 100% !important;
        max-height: 140px !important;
        flex-direction: row !important;
        overflow-x: auto !important;
      }
    }

    .sidebar-games {
      width: 240px;
      background: var(--panel-bg);
      backdrop-filter: blur(12px);
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      overflow-y: auto;
    }

    .game-card {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.03);
      cursor: pointer;
      border: 1px solid transparent;
      transition: all 0.2s;
      min-width: 140px;
    }

    .game-card:hover, .game-card.active {
      background: rgba(0, 240, 255, 0.15);
      border-color: var(--accent-cyan);
    }

    .game-icon {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      background: rgba(0, 0, 0, 0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .game-display {
      flex: 1;
      background: var(--panel-bg);
      backdrop-filter: blur(12px);
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 25px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    /* TIENDA (PLAYSTORE) */
    .grid-store {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 15px;
      width: 100%;
      align-content: start;
    }

    .store-item {
      background: var(--panel-bg);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      padding: 15px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    /* FONDOS */
    .grid-wallpapers {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 15px;
      width: 100%;
      align-content: start;
    }

    .wp-card {
      height: 120px;
      border-radius: 14px;
      cursor: pointer;
      border: 2px solid transparent;
      transition: all 0.25s;
      display: flex;
      align-items: flex-end;
      padding: 12px;
      font-weight: bold;
      text-shadow: 0 2px 4px rgba(0,0,0,0.8);
      font-size: 14px;
    }

    .wp-card:hover {
      border-color: var(--accent-cyan);
      transform: translateY(-3px);
    }

    /* AJUSTES */
    .settings-card {
      background: var(--panel-bg);
      backdrop-filter: blur(12px);
      border-radius: 18px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 25px;
      max-width: 450px;
      width: 100%;
      margin: 10px auto;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .input-field {
      width: 100%;
      padding: 12px 14px;
      background: rgba(0, 0, 0, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 10px;
      color: white;
      font-size: 15px;
      outline: none;
    }

    .input-field:focus {
      border-color: var(--accent-cyan);
      box-shadow: 0 0 10px rgba(0, 240, 255, 0.3);
    }

    .btn-action {
      background: linear-gradient(135deg, var(--accent-cyan), var(--accent-purple));
      color: white;
      border: none;
      padding: 12px 20px;
      border-radius: 10px;
      font-weight: bold;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-action:hover {
      opacity: 0.9;
      transform: scale(1.02);
    }

    /* PRIVACIDAD */
    .privacy-overlay {
      position: fixed;
      inset: 0;
      background: rgba(2, 6, 23, 0.92);
      backdrop-filter: blur(25px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    .privacy-overlay.active {
      opacity: 1;
      pointer-events: all;
    }

    .lock-box {
      background: rgba(15, 23, 42, 0.95);
      padding: 30px;
      border-radius: 20px;
      border: 1px solid rgba(0, 240, 255, 0.3);
      text-align: center;
      width: 300px;
    }

    /* GAME RUNNER MODAL */
    .game-modal {
      position: fixed;
      inset: 0;
      background: #000;
      z-index: 9000;
      display: none;
      flex-direction: column;
    }

    .game-modal.active {
      display: flex;
    }

    .game-modal-header {
      height: 45px;
      background: #0b0f19;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 15px;
      border-bottom: 1px solid rgba(0, 240, 255, 0.3);
    }

    canvas {
      flex: 1;
      width: 100%;
      height: 100%;
      background: #05070d;
    }
  </style>
</head>
<body>

  <!-- BARRA NAVEGACIÓN -->
  <div class="top-bar">
    <div class="brand">
      <span>🛸 COSMIC OS</span>
    </div>
    <div class="nav-tabs">
      <button class="tab-btn active" onclick="switchTab('gamespace', this)">🎮 GameSpace</button>
      <button class="tab-btn" onclick="switchTab('store', this)">🛍️ PlayStore</button>
      <button class="tab-btn" onclick="switchTab('wallpapers', this)">🖼️ Fondos</button>
      <button class="tab-btn" onclick="switchTab('settings', this)">⚙️ Ajustes</button>
    </div>
  </div>

  <!-- VISTAS PRINCIPALES -->
  <div class="view-container">

    <!-- 1. GAMESPACE -->
    <div id="gamespace" class="view-section gamespace-layout active">
      <div class="sidebar-games" id="installed-list">
        <!-- Juegos instalados -->
      </div>
      <div class="game-display">
        <div>
          <div style="display:flex; justify-content:space-between; align-items:center;">
            <h1 id="selected-title" style="font-size: 32px; text-transform: uppercase;">Sin Juegos</h1>
            <span style="font-size:12px; color:var(--accent-cyan); background:rgba(0,240,255,0.1); padding:4px 10px; border-radius:20px; border:1px solid rgba(0,240,255,0.3);">FPS: 60 | RAM: 32%</span>
          </div>
          <p id="selected-desc" style="color: var(--text-dim); margin-top: 12px; font-size:14px;">
            Ve a la <b>PlayStore</b> arriba para instalar juegos en tu contenedor aislado.
          </p>
        </div>
        <div style="margin-top: 20px;">
          <button class="btn-action" id="launch-btn" onclick="launchGame()" style="display:none; font-size:16px;">▶ Iniciar Juego</button>
        </div>
      </div>
    </div>

    <!-- 2. PLAYSTORE -->
    <div id="store" class="view-section">
      <div class="grid-store" id="store-list">
        <!-- Generado dinámicamente -->
      </div>
    </div>

    <!-- 3. FONDOS -->
    <div id="wallpapers" class="view-section">
      <div class="grid-wallpapers">
        <div class="wp-card" style="background: radial-gradient(circle, #0f172a 0%, #020617 100%);" onclick="setWallpaper('radial-gradient(circle, #0f172a 0%, #020617 100%)')">Vaciado Cósmico</div>
        <div class="wp-card" style="background: linear-gradient(135deg, #2e1065 0%, #030712 100%);" onclick="setWallpaper('linear-gradient(135deg, #2e1065 0%, #030712 100%)')">Nebulosa Violeta</div>
        <div class="wp-card" style="background: linear-gradient(135deg, #082f49 0%, #020617 100%);" onclick="setWallpaper('linear-gradient(135deg, #082f49 0%, #020617 100%)')">Ciber Neón Cyan</div>
        <div class="wp-card" style="background: linear-gradient(135deg, #4c0519 0%, #020617 100%);" onclick="setWallpaper('linear-gradient(135deg, #4c0519 0%, #020617 100%)')">Supernova Roja</div>
      </div>
    </div>

    <!-- 4. AJUSTES -->
    <div id="settings" class="view-section">
      <div class="settings-card">
        <h2 style="font-size:20px;">⚙️ Ajustes del Sistema</h2>
        <div>
          <label style="display:block; margin-bottom: 8px; color: var(--text-dim); font-size:13px;">Cambiar Contraseña de Privacidad</label>
          <input type="password" id="new-pin" class="input-field" placeholder="Escribe tu nueva contraseña" />
        </div>
        <button class="btn-action" onclick="savePassword()">Guardar Contraseña</button>
        <hr style="border-color: rgba(255,255,255,0.1);" />
        <div>
          <p style="color: var(--text-dim); font-size: 13px; margin-bottom: 10px;">Instalar en Teléfono:</p>
          <button class="btn-action" id="install-pwa-btn" style="width: 100%;">📥 Instalar como App / APK</button>
        </div>
      </div>
    </div>

  </div>

  <!-- PANTALLA PRIVACIDAD BLOQUEO -->
  <div class="privacy-overlay" id="privacy-overlay">
    <div class="lock-box">
      <h3 style="margin-bottom: 8px;">🔒 Espacio Protegido</h3>
      <p style="font-size: 12px; color: var(--text-dim); margin-bottom: 15px;">Ingresa la contraseña para ingresar</p>
      <input type="password" id="pin-input" class="input-field" placeholder="••••" style="text-align: center; margin-bottom: 15px;" />
      <button class="btn-action" style="width: 100%;" onclick="unlockScreen()">Desbloquear</button>
    </div>
  </div>

  <!-- MODAL DE EJECUCIÓN DE JUEGO -->
  <div class="game-modal" id="game-modal">
    <div class="game-modal-header">
      <span id="modal-game-title" style="font-weight:bold; color:var(--accent-cyan);">Juego</span>
      <button class="btn-action" style="padding:4px 12px; font-size:12px; background:var(--accent-pink);" onclick="closeGameModal()">❌ Salir</button>
    </div>
    <canvas id="gameCanvas"></canvas>
  </div>

  <script>
    let systemPin = localStorage.getItem('cosmic_pin') || "1234";
    let installedGames = JSON.parse(localStorage.getItem('cosmic_games')) || [];
    let selectedGameId = null;

    const storeCatalog = [
      { id: 'shooter', name: 'Space Defender', icon: '🚀', desc: 'Juego de naves en 2D interactivo.' },
      { id: 'fn', name: 'Fortnite', icon: '⚡', desc: 'Batalla real en servidor simulado.' },
      { id: 'tr', name: 'Terraria', icon: '🗡️', desc: 'Exploración y aventura 2D.' },
      { id: 'rb', name: 'Roblox', icon: '🧱', desc: 'Universo de experiencias virtuales.' },
      { id: 'mc', name: 'Minecraft', icon: '🟩', desc: 'Construcción y supervivencia aislada.' }
    ];

    // NAVEGACIÓN CORREGIDA (FUNCIONA AL 100%)
    function switchTab(tabId, btnElement) {
      document.querySelectorAll('.view-section').forEach(sec => sec.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));

      const targetSection = document.getElementById(tabId);
      if (targetSection) targetSection.classList.add('active');
      if (btnElement) btnElement.classList.add('active');
    }

    // TIENDA
    function renderStore() {
      const container = document.getElementById('store-list');
      container.innerHTML = storeCatalog.map(game => {
        const isInstalled = installedGames.some(g => g.id === game.id);
        return `
          <div class="store-item">
            <div class="game-icon" style="width:50px; height:50px; font-size:26px;">${game.icon}</div>
            <h4 style="font-size:16px;">${game.name}</h4>
            <p style="font-size:12px; color:var(--text-dim); flex:1;">${game.desc}</p>
            <button class="btn-action" onclick="toggleInstall('${game.id}')" style="width:100%; margin-top:5px; background:${isInstalled ? 'rgba(239,68,68,0.8)' : 'linear-gradient(135deg, var(--accent-cyan), var(--accent-purple))'};">
              ${isInstalled ? 'Desinstalar' : 'Instalar'}
            </button>
          </div>
        `;
      }).join('');
    }

    function toggleInstall(gameId) {
      const exists = installedGames.some(g => g.id === gameId);
      if (exists) {
        installedGames = installedGames.filter(g => g.id !== gameId);
      } else {
        const game = storeCatalog.find(g => g.id === gameId);
        installedGames.push(game);
      }
      localStorage.setItem('cosmic_games', JSON.stringify(installedGames));
      renderStore();
      renderGamespace();
    }

    // GAMESPACE
    function renderGamespace() {
      const listContainer = document.getElementById('installed-list');
      if (installedGames.length === 0) {
        listContainer.innerHTML = '<p style="color:var(--text-dim); text-align:center; padding:15px; font-size:13px;">No hay juegos instalados.</p>';
        document.getElementById('selected-title').innerText = 'Sin Juegos';
        document.getElementById('selected-desc').innerText = 'Ve a la PlayStore arriba para instalar juegos en tu contenedor aislado.';
        document.getElementById('launch-btn').style.display = 'none';
        return;
      }

      listContainer.innerHTML = installedGames.map(game => `
        <div class="game-card ${selectedGameId === game.id ? 'active' : ''}" onclick="selectGame('${game.id}')">
          <div class="game-icon">${game.icon}</div>
          <span style="font-weight:bold; font-size:14px;">${game.name}</span>
        </div>
      `).join('');

      if (!selectedGameId || !installedGames.some(g => g.id === selectedGameId)) {
        selectGame(installedGames[0].id);
      }
    }

    function selectGame(gameId) {
      selectedGameId = gameId;
      const game = installedGames.find(g => g.id === gameId);
      if (game) {
        document.getElementById('selected-title').innerText = game.name;
        document.getElementById('selected-desc').innerText = game.desc + ' - Entorno protegido sin acceso al almacenamiento raíz de tu teléfono.';
        document.getElementById('launch-btn').style.display = 'inline-block';
        
        document.querySelectorAll('.game-card').forEach(card => card.classList.remove('active'));
        renderGamespace();
      }
    }

    // EJECUCIÓN DEL MINIJUEGO
    let gameInterval = null;
    function launchGame() {
      const game = installedGames.find(g => g.id === selectedGameId);
      if (!game) return;

      document.getElementById('modal-game-title').innerText = game.name + ' (Aislado)';
      document.getElementById('game-modal').classList.add('active');

      const canvas = document.getElementById('gameCanvas');
      const ctx = canvas.getContext('2d');
      canvas.width = canvas.clientWidth;
      canvas.height = canvas.clientHeight;

      let player = { x: canvas.width / 2, y: canvas.height - 60, size: 20 };
      let bullets = [];
      let enemies = [];

      canvas.ontouchmove = (e) => {
        player.x = e.touches[0].clientX;
      };
      canvas.onmousemove = (e) => {
        player.x = e.clientX;
      };

      if (gameInterval) clearInterval(gameInterval);
      gameInterval = setInterval(() => {
        ctx.fillStyle = '#05070d';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Jugador
        ctx.fillStyle = '#00f0ff';
        ctx.beginPath();
        ctx.arc(player.x, player.y, player.size, 0, Math.PI * 2);
        ctx.fill();

        // Balas
        if (Math.random() < 0.2) bullets.push({ x: player.x, y: player.y - 20 });
        ctx.fillStyle = '#ff007f';
        bullets.forEach((b, i) => {
          b.y -= 8;
          ctx.fillRect(b.x - 2, b.y, 4, 10);
          if (b.y < 0) bullets.splice(i, 1);
        });

        // Enemigos
        if (Math.random() < 0.05) enemies.push({ x: Math.random() * canvas.width, y: 0 });
        ctx.fillStyle = '#8b5cf6';
        enemies.forEach((e, i) => {
          e.y += 3;
          ctx.beginPath();
          ctx.arc(e.x, e.y, 15, 0, Math.PI * 2);
          ctx.fill();

          // Colisión con balas
          bullets.forEach((b, bi) => {
            if (Math.hypot(e.x - b.x, e.y - b.y) < 20) {
              enemies.splice(i, 1);
              bullets.splice(bi, 1);
            }
          });
        });
      }, 1000 / 60);
    }

    function closeGameModal() {
      document.getElementById('game-modal').classList.remove('active');
      if (gameInterval) clearInterval(gameInterval);
    }

    // CAMBIAR FONDO
    function setWallpaper(bgCss) {
      document.body.style.background = bgCss;
      document.body.style.backgroundSize = 'cover';
    }

    // CONTRASEÑA
    function savePassword() {
      const val = document.getElementById('new-pin').value.trim();
      if (val.length > 0) {
        systemPin = val;
        localStorage.setItem('cosmic_pin', systemPin);
        alert('Contraseña actualizada correctamente.');
        document.getElementById('new-pin').value = '';
      } else {
        alert('Escribe una contraseña válida.');
      }
    }

    window.addEventListener('blur', () => {
      document.getElementById('privacy-overlay').classList.add('active');
    });

    function unlockScreen() {
      if (document.getElementById('pin-input').value === systemPin) {
        document.getElementById('privacy-overlay').classList.remove('active');
        document.getElementById('pin-input').value = '';
      } else {
        alert('Contraseña incorrecta.');
        document.getElementById('pin-input').value = '';
      }
    }

    // PWA
    let deferredPrompt;
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      document.getElementById('install-pwa-btn').onclick = () => deferredPrompt.prompt();
    });

    // INICIAR
    renderStore();
    renderGamespace();
  </script>
</body>
</html>
