<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>You Shou Yan - Auto-Streamer</title>
  <style>
    :root {
      --bg-main: #05050d;
      --accent-glow: #ffaa00;
      --accent-secondary: #00ff88;
      --card-bg: rgba(20, 18, 38, 0.7);
      --border-color: rgba(255, 255, 255, 0.12);
      --text-main: #ffffff;
      --text-dim: #a0a0c0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-main);
      color: var(--text-main);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .space-bg {
      position: fixed;
      inset: 0;
      z-index: -1;
      background: radial-gradient(circle at 50% 20%, var(--accent-glow) 0%, transparent 60%),
                  radial-gradient(circle at 80% 80%, var(--accent-secondary) 0%, transparent 50%),
                  #030208;
      opacity: 0.35;
      filter: blur(40px);
    }

    .app-header {
      padding: 12px 16px;
      background: rgba(10, 8, 20, 0.85);
      backdrop-filter: blur(15px);
      border-bottom: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
    }

    .brand-title {
      font-size: 15px;
      font-weight: 900;
      background: linear-gradient(90deg, #ffffff, var(--accent-glow));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .memory-badge {
      font-size: 10px;
      background: rgba(0, 255, 136, 0.15);
      color: var(--accent-secondary);
      border: 1px solid var(--accent-secondary);
      padding: 3px 8px;
      border-radius: 12px;
      font-weight: bold;
    }

    .reader-container {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 10px 0;
    }

    .reader-container img {
      width: 100%;
      max-width: 650px;
      display: block;
    }

    .nav-bar {
      height: 65px;
      background: rgba(10, 8, 20, 0.95);
      border-top: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 16px;
      z-index: 10;
    }

    .btn-nav {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      color: #fff;
      padding: 10px 16px;
      border-radius: 12px;
      font-weight: bold;
      font-size: 13px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .btn-nav:active {
      background: var(--accent-glow);
      color: #000;
    }

    .chapter-indicator {
      text-align: center;
    }

    .chapter-title {
      font-size: 13px;
      font-weight: bold;
      color: var(--accent-glow);
    }

    .status-text {
      font-size: 10px;
      color: var(--text-dim);
    }
  </style>
</head>
<body>

  <div class="space-bg"></div>

  <div class="app-header">
    <div class="brand-title">🐾 YOU SHOU YAN AI-STREAM</div>
    <div class="memory-badge" id="memory-status">⚡ RAM: 0 MB (Limpio)</div>
  </div>

  <!-- CONTENEDOR DE LECTURA (Solo 1 capítulo en memoria) -->
  <div class="reader-container" id="reader-view">
    <!-- Las páginas se cargan dinámicamente aquí -->
  </div>

  <!-- BARRA DE NAVEGACIÓN DENSAMENTE OPTIMIZADA -->
  <div class="nav-bar">
    <button class="btn-nav" onclick="navigateChapter(-1)">◀ Anterior</button>
    
    <div class="chapter-indicator">
      <div class="chapter-title" id="current-ch-title">Capítulo 1</div>
      <div class="status-text" id="ai-status">🤖 IA: Memoria Optimizada</div>
    </div>

    <button class="btn-nav" onclick="navigateChapter(1)">Siguiente ▶</button>
  </div>

  <script>
    // Motor de búsqueda/stream simulado para You Shou Yan
    let currentChapterIndex = 1;
    const maxChapters = 1000; // Límite de capítulos
    let loadedPages = [];

    // Esta función actúa como la "IA" que obtiene las imágenes del capítulo en vivo
    function fetchChapterData(chapterNum) {
      // Generamos dinámicamente las rutas/enlaces para el capítulo solicitado
      // En un entorno de producción, aquí la IA consulta la fuente remota.
      return [
        `https://static.tvtropes.org/pmwiki/pub/images/fabulous_beasts.png`,
        `https://m.media-amazon.com/images/M/MV5BMDM0NDNmYzgtNjg2Yi00ZDIxLTk1MzQtZDM4NzdiNzE5YTRiXkEyXkFqcGc@._V1_.jpg`
      ];
    }

    // PURGA Y BORRADO DE MEMORIA EN TIEMPO REAL
    function purgeCurrentChapterMemory() {
      const container = document.getElementById('reader-view');
      
      // 1. Destruimos las referencias DOM de las imágenes
      while (container.firstChild) {
        if (container.firstChild.tagName === 'IMG') {
          container.firstChild.src = ''; // Detener descarga
        }
        container.removeChild(container.firstChild);
      }

      // 2. Vaciamos el array en JS
      loadedPages = [];

      // 3. Notificamos estado
      document.getElementById('memory-status').innerText = '⚡ RAM: Liberada (0 KB)';
      document.getElementById('memory-status').style.borderColor = '#00ff88';
    }

    // CARGA DEL CAPÍTULO ACTUAL
    function loadChapter(chapterNum) {
      // PASO 1: Borrar todo lo anterior
      purgeCurrentChapterMemory();

      // PASO 2: Actualizar UI
      document.getElementById('current-ch-title').innerText = `You Shou Yan - Cap. ${chapterNum}`;
      document.getElementById('ai-status').innerText = `🤖 Cargando Cap. ${chapterNum}...`;

      // PASO 3: Obtener solo las páginas del nuevo capítulo
      setTimeout(() => {
        loadedPages = fetchChapterData(chapterNum);
        const container = document.getElementById('reader-view');

        loadedPages.forEach((url, idx) => {
          const img = document.createElement('img');
          img.src = url;
          img.alt = `Capítulo ${chapterNum} - Página ${idx + 1}`;
          container.appendChild(img);
        });

        // Scroll al inicio arriba
        container.scrollTop = 0;

        // Mostrar uso de memoria controlado
        const estimatedMB = (loadedPages.length * 1.2).toFixed(1);
        document.getElementById('memory-status').innerText = `⚡ RAM Usada: ~${estimatedMB} MB`;
        document.getElementById('ai-status').innerText = `🤖 Cap. ${chapterNum} Activo`;
      }, 200);
    }

    // NAVEGACIÓN CON AUTO-BORRADO
    function navigateChapter(direction) {
      const target = currentChapterIndex + direction;
      if (target < 1) {
        alert("¡Estás en el primer capítulo!");
        return;
      }
      if (target > maxChapters) {
        alert("¡Has llegado al último capítulo disponible!");
        return;
      }

      currentChapterIndex = target;
      loadChapter(currentChapterIndex);
    }

    // Cargar Capítulo 1 al iniciar
    loadChapter(currentChapterIndex);
  </script>
</body>
</html>
