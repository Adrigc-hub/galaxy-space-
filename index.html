<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Cosmic GameSpace & Play Store</title>
  <link rel="manifest" href="manifest.json" />
  <style>
    :root {
      --bg-dark: #080711;
      --bg-card: #121026;
      --accent-red: #ff0055;
      --accent-cyan: #00f0ff;
      --accent-purple: #8ab4f8;
      --accent-green: #01875f;
      --text-main: #ffffff;
      --text-dim: #9aa0a6;
      --border-color: rgba(255, 255, 255, 0.12);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* BARRA SUPERIOR MODO PLAYSTORE */
    .store-header {
      padding: 12px 16px 8px;
      background: #121020;
      display: flex;
      flex-direction: column;
      gap: 12px;
      border-bottom: 1px solid var(--border-color);
      z-index: 10;
    }

    .search-bar-container {
      display: flex;
      align-items: center;
      background: #1c1a32;
      border-radius: 28px;
      padding: 6px 16px;
      gap: 12px;
    }

    .search-input {
      flex: 1;
      background: transparent;
      border: none;
      color: #fff;
      font-size: 14px;
      outline: none;
    }

    .profile-avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: linear-gradient(135deg, #ff0055, #8ab4f8);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 14px;
    }

    .top-categories {
      display: flex;
      gap: 18px;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .top-categories::-webkit-scrollbar { display: none; }

    .cat-pill {
      font-size: 13px;
      color: var(--text-dim);
      white-space: nowrap;
      cursor: pointer;
      padding-bottom: 4px;
      border-bottom: 2px solid transparent;
    }

    .cat-pill.active {
      color: var(--accent-cyan);
      border-bottom-color: var(--accent-cyan);
      font-weight: bold;
    }

    /* CONTENEDOR DE VISTAS */
    .main-content {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      padding-bottom: 75px;
    }

    /* MODO GAMESPACE (ESTILO VIDEO ORIGINAL) */
    .gamespace-container {
      display: flex;
      flex-direction: column;
      height: 100%;
      gap: 16px;
      background: radial-gradient(circle at center, #1b0a2a 0%, #05030a 100%);
      padding: 15px;
      border-radius: 20px;
      border: 1px solid rgba(255, 0, 85, 0.3);
      box-shadow: 0 0 25px rgba(255, 0, 85, 0.15);
    }

    .gs-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .gs-title {
      font-size: 20px;
      font-weight: 900;
      letter-spacing: 2px;
      background: linear-gradient(90deg, #ff0055, #00f0ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .gs-body {
      display: flex;
      flex: 1;
      gap: 15px;
    }

    .gs-sidebar {
      width: 140px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      overflow-y: auto;
    }

    .gs-card {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 8px;
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .gs-card.active {
      border-color: var(--accent-red);
      background: rgba(255, 0, 85, 0.15);
      box-shadow: 0 0 10px rgba(255, 0, 85, 0.4);
    }

    .gs-preview {
      flex: 1;
      background: rgba(0, 0, 0, 0.4);
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 20px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      text-align: center;
    }

    /* CARDS DE PLAYSTORE */
    .section-title {
      font-size: 16px;
      font-weight: bold;
      margin: 16px 0 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .horizontal-scroll {
      display: flex;
      gap: 12px;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .horizontal-scroll::-webkit-scrollbar { display: none; }

    .item-card-vert {
      width: 110px;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      gap: 6px;
      cursor: pointer;
    }

    .item-icon {
      width: 110px;
      height: 110px;
      border-radius: 20px;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 40px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.4);
      overflow: hidden;
    }

    /* BARRA INFERIOR DE NAVEGACIÓN */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 60px;
      background: #121020;
      display: flex;
      justify-content: space-around;
      align-items: center;
      border-top: 1px solid var(--border-color);
      z-index: 100;
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      color: var(--text-dim);
      font-size: 10px;
      cursor: pointer;
    }

    .nav-item.active {
      color: var(--accent-cyan);
      font-weight: bold;
    }

    .nav-icon {
      font-size: 18px;
      padding: 3px 14px;
      border-radius: 14px;
    }

    .nav-item.active .nav-icon {
      background: rgba(0, 240, 255, 0.15);
    }

    .btn-main {
      background: linear-gradient(135deg, var(--accent-red), #ff5500);
      color: #fff;
      border: none;
      padding: 10px 20px;
      border-radius: 12px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(255, 0, 85, 0.4);
    }

    /* VENTANA MODAL DEL JUEGO / CÓMIC */
    .game-modal {
      position: fixed;
      inset: 0;
      background: #000;
      z-index: 99999;
      display: none;
      flex-direction: column;
    }

    .game-modal.active {
      display: flex;
    }

    .game-header {
      height: 48px;
      background: #121020;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 16px;
      border-bottom: 1px solid var(--border-color);
    }

    iframe {
      flex: 1;
      border: none;
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>

  <!-- BARRA SUPERIOR PLAY STORE -->
  <div class="store-header" id="store-header">
    <div class="search-bar-container">
      <span style="color: var(--text-dim);">🔍</span>
      <input type="text" id="global-search" class="search-input" placeholder="Buscar juegos, cómics, anime..." oninput="renderView()" />
      <div class="profile-avatar">A</div>
    </div>

    <div class="top-categories">
      <span class="cat-pill active">Para ti</span>
      <span class="cat-pill">Listas de éxitos</span>
      <span class="cat-pill">Infantiles</span>
      <span class="cat-pill">Premium</span>
    </div>
  </div>

  <!-- VISTA PRINCIPAL DINÁMICA -->
  <div class="main-content" id="main-view"></div>

  <!-- NAVEGACIÓN INFERIOR NATIVA -->
  <div class="bottom-nav">
    <div class="nav-item" onclick="switchNav('gamespace', this)">
      <div class="nav-icon">🚀</div>
      <span>GameSpace</span>
    </div>
    <div class="nav-item active" onclick="switchNav('juegos', this)">
      <div class="nav-icon">🎮</div>
      <span>Juegos</span>
    </div>
    <div class="nav-item" onclick="switchNav('libros', this)">
      <div class="nav-icon">📚</div>
      <span>Cómics/Manga</span>
    </div>
    <div class="nav-item" onclick="switchNav('creador', this)">
      <div class="nav-icon">🛠️</div>
      <span>Creador</span>
    </div>
  </div>

  <!-- MODAL PARA JUGAR O LEER CÓMICS -->
  <div class="game-modal" id="game-modal">
    <div class="game-header">
      <span id="modal-title" style="font-weight: bold; color: var(--accent-cyan);">Contenido</span>
      <button onclick="closeModal()" style="background: var(--accent-red); color: white; border: none; padding: 6px 14px; border-radius: 10px; font-weight: bold;">✕ Salir</button>
    </div>
    <iframe id="content-iframe" src=""></iframe>
  </div>

  <script>
    // BASE DE DATOS LOCAL
    let gsGames = [
      { id: 'fn', name: 'Fortnite', icon: '⚡', desc: 'Battle Royale en el espacio.', url: 'https://play2048.co/' },
      { id: 'tr', name: 'Terraria', icon: '🌳', desc: 'Exploración y construcción 2D.', url: 'https://playsnake.org/' },
      { id: 'rb', name: 'Roblox', icon: '🟥', desc: 'Universo virtual sandbox.', url: 'https://freepacman.org/' },
      { id: 'cr', name: 'Clash Royale', icon: '👑', desc: 'Estrategia en tiempo real.', url: 'https://play2048.co/' },
      { id: 'dl', name: 'DL2026', icon: '⚽', desc: 'Fútbol espacial táctico.', url: 'https://tetris.com/play-tetris' }
    ];

    let comicsList = [
      { id: 'fb', name: 'Fabulous Beasts (Fei Ren Zai)', icon: '🐉', type: 'Manhua', desc: 'Monstruos mitológicos en la vida moderna.', url: 'https://m.youtube.com/results?search_query=fabulous+beasts+fei+ren+zai+esp' },
      { id: 'sp1', name: 'Spider-Man: Spider-Verse', icon: '🕷️', type: 'Cómic Marvel', desc: 'Aventuras a través del Multiverso.', url: 'https://m.youtube.com/results?search_query=spiderman+comic+audiocomic' },
      { id: 'an1', name: 'Jujutsu Kaisen Anime', icon: '🔥', type: 'Anime', desc: 'Hechiceros y maldiciones.', url: 'https://m.youtube.com/results?search_query=jujutsu+kaisen+capitulo+1+español' }
    ];

    let selectedGsId = gsGames[0].id;
    let currentTab = 'juegos';

    function renderView() {
      const container = document.getElementById('main-view');
      const searchVal = document.getElementById('global-search').value.toLowerCase();

      if (currentTab === 'gamespace') {
        document.getElementById('store-header').style.display = 'none';
        const selected = gsGames.find(g => g.id === selectedGsId) || gsGames[0];

        container.innerHTML = `
          <div class="gamespace-container">
            <div class="gs-header">
              <span class="gs-title">GAMESPACE 8.5.1</span>
              <span style="font-size:11px; color:var(--accent-cyan);">MODO ENTORNO AISLADO</span>
            </div>
            <div class="gs-body">
              <div class="gs-sidebar">
                ${gsGames.map(g => `
                  <div class="gs-card ${g.id === selectedGsId ? 'active' : ''}" onclick="selectGsGame('${g.id}')">
                    <span style="font-size:20px;">${g.icon}</span>
                    <span style="font-size:12px; font-weight:bold;">${g.name}</span>
                  </div>
                `).join('')}
              </div>
              <div class="gs-preview">
                <div>
                  <div style="font-size:50px; margin-bottom:10px;">${selected.icon}</div>
                  <h2 style="text-transform:uppercase; letter-spacing:1px;">${selected.name}</h2>
                  <p style="font-size:12px; color:var(--text-dim); margin-top:8px;">${selected.desc}</p>
                </div>
                <button class="btn-main" onclick="openContent('${selected.url}', '${selected.name}')">▶ Iniciar Juego</button>
              </div>
            </div>
          </div>
        `;
      } else {
        document.getElementById('store-header').style.display = 'flex';

        if (currentTab === 'juegos') {
          const filtered = gsGames.filter(g => g.name.toLowerCase().includes(searchVal));
          container.innerHTML = `
            <div class="section-title"><span>Recomendados para ti</span></div>
            <div class="horizontal-scroll">
              ${filtered.map(g => `
                <div class="item-card-vert" onclick="openContent('${g.url}', '${g.name}')">
                  <div class="item-icon">${g.icon}</div>
                  <div style="font-size:12px; font-weight:bold;">${g.name}</div>
                </div>
              `).join('')}
            </div>

            <div class="section-title"><span>Juegos Populares</span></div>
            <div style="display:flex; flex-direction:column; gap:10px;">
              ${filtered.map(g => `
                <div style="display:flex; align-items:center; justify-content:space-between; background:var(--bg-card); padding:10px; border-radius:14px;" onclick="openContent('${g.url}', '${g.name}')">
                  <div style="display:flex; align-items:center; gap:12px;">
                    <div class="item-icon" style="width:48px; height:48px; font-size:24px;">${g.icon}</div>
                    <div>
                      <div style="font-weight:bold; font-size:13px;">${g.name}</div>
                      <div style="font-size:11px; color:var(--text-dim);">${g.desc}</div>
                    </div>
                  </div>
                  <button class="btn-main" style="padding:6px 14px; font-size:12px;">Jugar</button>
                </div>
              `).join('')}
            </div>
          `;
        } else if (currentTab === 'libros') {
          const filteredC = comicsList.filter(c => c.name.toLowerCase().includes(searchVal));
          container.innerHTML = `
            <div class="section-title"><span>Cómics, Manga y Anime Gratis</span></div>
            <div style="display:flex; flex-direction:column; gap:12px;">
              ${filteredC.map(c => `
                <div style="display:flex; align-items:center; justify-content:space-between; background:var(--bg-card); padding:12px; border-radius:14px;" onclick="openContent('${c.url}', '${c.name}')">
                  <div style="display:flex; align-items:center; gap:12px;">
                    <div class="item-icon" style="width:50px; height:50px; font-size:26px; background:#1e142d;">${c.icon}</div>
                    <div>
                      <div style="font-weight:bold; font-size:14px;">${c.name}</div>
                      <div style="font-size:11px; color:var(--accent-purple);">${c.type}</div>
                      <div style="font-size:11px; color:var(--text-dim);">${c.desc}</div>
                    </div>
                  </div>
                  <button class="btn-main" style="background: linear-gradient(135deg, #00f0ff, #0088ff); color:#000;">Leer/Ver</button>
                </div>
              `).join('')}
            </div>
          `;
        } else if (currentTab === 'creador') {
          container.innerHTML = `
            <div style="background:var(--bg-card); padding:20px; border-radius:16px; border:1px solid var(--border-color); display:flex; flex-direction:column; gap:12px;">
              <h3>🛠️ Creador & Editor HTML5 Offline</h3>
              <p style="font-size:12px; color:var(--text-dim);">Añade tu propio juego o cómic ingresando el título y la URL directa:</p>
              <input type="text" id="new-title" style="padding:10px; background:#080711; border:1px solid var(--border-color); border-radius:8px; color:#fff;" placeholder="Título del juego/cómic..." />
              <input type="text" id="new-icon" style="padding:10px; background:#080711; border:1px solid var(--border-color); border-radius:8px; color:#fff;" placeholder="Emoji Icono (ej: 🐉)" />
              <input type="text" id="new-url" style="padding:10px; background:#080711; border:1px solid var(--border-color); border-radius:8px; color:#fff;" placeholder="URL del contenido (https://...)" />
              <button class="btn-main" onclick="addNewCustomItem()">🚀 Publicar en mi Play Store</button>
            </div>
          `;
        }
      }
    }

    function selectGsGame(id) {
      selectedGsId = id;
      renderView();
    }

    function switchNav(tab, el) {
      currentTab = tab;
      document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
      el.classList.add('active');
      renderView();
    }

    function addNewCustomItem() {
      const title = document.getElementById('new-title').value;
      const icon = document.getElementById('new-icon').value || '🎮';
      const url = document.getElementById('new-url').value;

      if (!title || !url) return alert('Por favor llena los campos obligatorios.');

      gsGames.unshift({ id: 'c_' + Date.now(), name: title, icon: icon, desc: 'Añadido por el usuario.', url: url });
      alert('¡Publicado con éxito!');
      switchNav('juegos', document.querySelectorAll('.nav-item')[1]);
    }

    function openContent(url, title) {
      document.getElementById('modal-title').innerText = title;
      document.getElementById('content-iframe').src = url;
      document.getElementById('game-modal').classList.add('active');
    }

    function closeModal() {
      document.getElementById('game-modal').classList.remove('active');
      document.getElementById('content-iframe').src = '';
    }

    // Inicializar
    renderView();
  </script>
</body>
</html>
