<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Cosmic Hub & Play Store</title>
  <link rel="manifest" href="manifest.json" />
  <!-- Script para renderizar modelos 3D interactivos -->
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
  <style>
    :root {
      --bg-dark: #080711;
      --bg-card: #121026;
      --accent-red: #ff0055;
      --accent-cyan: #00f0ff;
      --accent-purple: #a855f7;
      --text-main: #ffffff;
      --text-dim: #9aa0a6;
      --border-color: rgba(255, 255, 255, 0.12);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* BARRA SUPERIOR */
    .store-header {
      padding: 12px 16px 8px;
      background: #121020;
      display: flex;
      flex-direction: column;
      gap: 10px;
      border-bottom: 1px solid var(--border-color);
      z-index: 10;
    }

    .search-bar-container {
      display: flex;
      align-items: center;
      background: #1c1a32;
      border-radius: 28px;
      padding: 6px 16px;
      gap: 12px;
    }

    .search-input {
      flex: 1;
      background: transparent;
      border: none;
      color: #fff;
      font-size: 14px;
      outline: none;
    }

    .profile-avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent-red), var(--accent-cyan));
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
    }

    .top-categories {
      display: flex;
      gap: 16px;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .top-categories::-webkit-scrollbar { display: none; }

    .cat-pill {
      font-size: 13px;
      color: var(--text-dim);
      white-space: nowrap;
      cursor: pointer;
      padding-bottom: 4px;
      border-bottom: 2px solid transparent;
    }

    .cat-pill.active {
      color: var(--accent-cyan);
      border-bottom-color: var(--accent-cyan);
      font-weight: bold;
    }

    /* CONTENEDOR DE CONTENIDO */
    .main-content {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      padding-bottom: 75px;
    }

    /* MODO GAMESPACE */
    .gamespace-container {
      display: flex;
      flex-direction: column;
      height: 100%;
      gap: 16px;
      background: radial-gradient(circle at center, #1b0a2a 0%, #05030a 100%);
      padding: 15px;
      border-radius: 20px;
      border: 1px solid rgba(255, 0, 85, 0.3);
    }

    .gs-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .gs-title {
      font-size: 18px;
      font-weight: 900;
      letter-spacing: 2px;
      background: linear-gradient(90deg, var(--accent-red), var(--accent-cyan));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .gs-body {
      display: flex;
      flex: 1;
      gap: 15px;
      overflow: hidden;
    }

    .gs-sidebar {
      width: 130px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      overflow-y: auto;
    }

    .gs-card {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 8px;
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
    }

    .gs-card.active {
      border-color: var(--accent-red);
      background: rgba(255, 0, 85, 0.15);
    }

    .gs-preview {
      flex: 1;
      background: rgba(0, 0, 0, 0.5);
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 20px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      text-align: center;
    }

    /* CARDS */
    .grid-container {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
      gap: 14px;
      margin-top: 10px;
    }

    .item-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 6px;
      cursor: pointer;
    }

    .item-icon {
      width: 60px;
      height: 60px;
      border-radius: 14px;
      background: #1c1a32;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
    }

    .item-title {
      font-size: 11px;
      font-weight: bold;
      line-height: 1.2;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    /* BARRA INFERIOR */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 60px;
      background: #121020;
      display: flex;
      justify-content: space-around;
      align-items: center;
      border-top: 1px solid var(--border-color);
      z-index: 100;
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      color: var(--text-dim);
      font-size: 10px;
      cursor: pointer;
    }

    .nav-item.active {
      color: var(--accent-cyan);
      font-weight: bold;
    }

    .nav-icon {
      font-size: 18px;
      padding: 2px 12px;
      border-radius: 12px;
    }

    .nav-item.active .nav-icon {
      background: rgba(0, 240, 255, 0.15);
    }

    .btn-main {
      background: linear-gradient(135deg, var(--accent-red), #ff5500);
      color: #fff;
      border: none;
      padding: 8px 16px;
      border-radius: 10px;
      font-weight: bold;
      cursor: pointer;
    }

    /* MODAL DE JUEGO / CÓMIC / MODELO 3D */
    .game-modal {
      position: fixed;
      inset: 0;
      background: #000;
      z-index: 99999;
      display: none;
      flex-direction: column;
    }

    .game-modal.active {
      display: flex;
    }

    .game-header {
      height: 50px;
      background: #121020;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 12px;
      border-bottom: 1px solid var(--border-color);
    }

    .modal-body {
      flex: 1;
      width: 100%;
      height: 100%;
      position: relative;
    }

    iframe, model-viewer {
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>
<body>

  <!-- BARRA SUPERIOR -->
  <div class="store-header" id="store-header">
    <div class="search-bar-container">
      <span>🔍</span>
      <input type="text" id="global-search" class="search-input" placeholder="Buscar juegos, cómics, modelos..." oninput="renderView()" />
      <div class="profile-avatar">A</div>
    </div>

    <div class="top-categories">
      <span class="cat-pill active">Para ti</span>
      <span class="cat-pill">Listas de éxitos</span>
      <span class="cat-pill">Infantiles</span>
      <span class="cat-pill">Premium</span>
    </div>
  </div>

  <!-- VISTA PRINCIPAL -->
  <div class="main-content" id="main-view"></div>

  <!-- NAVEGACIÓN INFERIOR -->
  <div class="bottom-nav">
    <div class="nav-item" onclick="switchNav('gamespace', this)">
      <div class="nav-icon">🚀</div>
      <span>GameSpace</span>
    </div>
    <div class="nav-item active" onclick="switchNav('juegos', this)">
      <div class="nav-icon">🎮</div>
      <span>Juegos (50+)</span>
    </div>
    <div class="nav-item" onclick="switchNav('libros', this)">
      <div class="nav-icon">📚</div>
      <span>Cómics (50+)</span>
    </div>
    <div class="nav-item" onclick="switchNav('modelos', this)">
      <div class="nav-icon">🎨</div>
      <span>3D & Anims</span>
    </div>
    <div class="nav-item" onclick="switchNav('creador', this)">
      <div class="nav-icon">🛠️</div>
      <span>Creador</span>
    </div>
  </div>

  <!-- MODAL DE VISUALIZACIÓN -->
  <div class="game-modal" id="game-modal">
    <div class="game-header">
      <span id="modal-title" style="font-weight: bold; color: var(--accent-cyan); font-size:14px;">Cargando...</span>
      <div style="display:flex; gap:8px;">
        <button onclick="launchExternal()" style="background: var(--accent-purple); color: white; border: none; padding: 6px 10px; border-radius: 8px; font-size: 11px; font-weight: bold;">⚡ Abrir fuera (Modo App)</button>
        <button onclick="closeModal()" style="background: var(--accent-red); color: white; border: none; padding: 6px 12px; border-radius: 8px; font-weight: bold;">✕ Salir</button>
      </div>
    </div>
    <div class="modal-body" id="modal-body-content"></div>
  </div>

  <script>
    // GENERADOR DINÁMICO DE 50+ JUEGOS
    let gamesList = [
      { name: 'Roblox Web / Launcher', icon: '🟥', url: 'https://www.roblox.com/discover', desc: 'Plataforma oficial de Roblox.' },
      { name: 'Fortnite Web', icon: '⚡', url: 'https://www.xbox.com/play/games/fortnite', desc: 'Juega Fortnite en la nube.' },
      { name: 'Terraria HTML5', icon: '🌳', url: 'https://playsnake.org/', desc: 'Exploración sandbox.' },
      { name: 'Clash Royale Web', icon: '👑', url: 'https://play2048.co/', desc: 'Estrategia en tiempo real.' },
      { name: 'Geometry Dash Classic', icon: '🟩', url: 'https://freegeometrydash.com/', desc: 'Saltos al ritmo de la música.' },
      { name: 'Pac-Man Retro', icon: '🟡', url: 'https://freepacman.org/', desc: 'El clásico de arcade.' }
    ];

    for (let i = 7; i <= 55; i++) {
      gamesList.push({
        name: `Juego Arcade ${i}`,
        icon: ['🎮', '👾', '🕹️', '🎲', '🏎️', '⚽'][i % 6],
        url: 'https://play2048.co/',
        desc: `Juego minijuego HTML5 offline/online #${i}`
      });
    }

    // GENERADOR DINÁMICO DE 50+ CÓMICS, MANGA Y FABULOUS BEASTS
    let comicsList = [
      { name: 'Fabulous Beasts (You Shan Yan / Fei Ren Zai)', icon: '🐉', type: 'Manhua', url: 'https://m.youtube.com/results?search_query=fei+ren+zai+fabulous+beasts+español' },
      { name: 'Spider-Man: Across the Spider-Verse', icon: '🕷️', type: 'Cómic Marvel', url: 'https://m.youtube.com/results?search_query=spiderman+comic+audiocomic+español' },
      { name: 'Spider-Man: Ultimate Origins', icon: '🕸️', type: 'Cómic Marvel', url: 'https://m.youtube.com/results?search_query=ultimate+spiderman+comic+español' },
      { name: 'Jujutsu Kaisen Manga/Anime', icon: '🔥', type: 'Anime / Manga', url: 'https://m.youtube.com/results?search_query=jujutsu+kaisen+capitulo+español' },
      { name: 'Dragon Ball Super', icon: '🟠', type: 'Anime / Manga', url: 'https://m.youtube.com/results?search_query=dragon+ball+super+manga+español' }
    ];

    for (let i = 6; i <= 55; i++) {
      let types = ['Cómic Marvel', 'Anime', 'Manhua / Manga', 'Webtoon'];
      let icons = ['📚', '🦸‍♂️', '⚔️', '✨', '🦊', '⚡'];
      comicsList.push({
        name: `Cómic/Manga Vol. ${i}`,
        icon: icons[i % icons.length],
        type: types[i % types.length],
        url: 'https://m.youtube.com/results?search_query=audiocomic+español'
      });
    }

    // MODELOS 3D Y ANIMACIONES INTERACTIVAS
    let modelsList = [
      { name: 'Astronauta 3D Interactivo', icon: '👨‍🚀', url: 'https://modelviewer.dev/shared-assets/models/Astronaut.glb' },
      { name: 'Robot Animado 3D', icon: '🤖', url: 'https://modelviewer.dev/shared-assets/models/RobotExpressive.glb' },
      { name: 'Zorro Antropomórfico 3D', icon: '🦊', url: 'https://modelviewer.dev/shared-assets/models/Fox.glb' }
    ];

    let currentTab = 'juegos';
    let activeUrl = '';

    function renderView() {
      const container = document.getElementById('main-view');
      const searchVal = document.getElementById('global-search').value.toLowerCase();

      if (currentTab === 'gamespace') {
        document.getElementById('store-header').style.display = 'none';
        container.innerHTML = `
          <div class="gamespace-container">
            <div class="gs-header">
              <span class="gs-title">GAMESPACE LAUNCHER</span>
              <span style="font-size:10px; color:var(--accent-cyan);">MODO OPTIMIZADO</span>
            </div>
            <div class="gs-body">
              <div class="gs-sidebar">
                ${gamesList.slice(0, 8).map(g => `
                  <div class="gs-card" onclick="openContent('${g.url}', '${g.name}')">
                    <span style="font-size:18px;">${g.icon}</span>
                    <span style="font-size:11px; font-weight:bold;">${g.name}</span>
                  </div>
                `).join('')}
              </div>
              <div class="gs-preview">
                <div style="font-size:45px;">🚀</div>
                <h3>Lanzador de Juegos</h3>
                <p style="font-size:11px; color:var(--text-dim); margin:8px 0;">Acceso directo a más de 50 títulos sin lags.</p>
                <button class="btn-main" onclick="openContent('https://www.roblox.com/discover', 'Roblox')">▶ Iniciar Roblox</button>
              </div>
            </div>
          </div>
        `;
      } else {
        document.getElementById('store-header').style.display = 'flex';

        if (currentTab === 'juegos') {
          const filtered = gamesList.filter(g => g.name.toLowerCase().includes(searchVal));
          container.innerHTML = `
            <div style="font-weight:bold; margin-bottom:8px; font-size:14px;">🎮 Catálogo de Juegos (${filtered.length})</div>
            <div class="grid-container">
              ${filtered.map(g => `
                <div class="item-card" onclick="openContent('${g.url}', '${g.name}')">
                  <div class="item-icon">${g.icon}</div>
                  <div class="item-title">${g.name}</div>
                </div>
              `).join('')}
            </div>
          `;
        } else if (currentTab === 'libros') {
          const filtered = comicsList.filter(c => c.name.toLowerCase().includes(searchVal));
          container.innerHTML = `
            <div style="font-weight:bold; margin-bottom:8px; font-size:14px;">📚 Cómics, Manga y Fabulous Beasts (${filtered.length})</div>
            <div class="grid-container">
              ${filtered.map(c => `
                <div class="item-card" onclick="openContent('${c.url}', '${c.name}')">
                  <div class="item-icon" style="background:#231435;">${c.icon}</div>
                  <div class="item-title">${c.name}</div>
                  <div style="font-size:9px; color:var(--accent-cyan);">${c.type}</div>
                </div>
              `).join('')}
            </div>
          `;
        } else if (currentTab === 'modelos') {
          container.innerHTML = `
            <div style="font-weight:bold; margin-bottom:8px; font-size:14px;">🎨 Modelos 3D y Animaciones Interactivas</div>
            <div class="grid-container">
              ${modelsList.map(m => `
                <div class="item-card" onclick="openModel3D('${m.url}', '${m.name}')">
                  <div class="item-icon" style="background:#102835;">${m.icon}</div>
                  <div class="item-title">${m.name}</div>
                  <div style="font-size:9px; color:var(--accent-purple);">Modelo 3D GLTF</div>
                </div>
              `).join('')}
            </div>
          `;
        } else if (currentTab === 'creador') {
          container.innerHTML = `
            <div style="background:var(--bg-card); padding:16px; border-radius:16px; border:1px solid var(--border-color); display:flex; flex-direction:column; gap:10px;">
              <h3>🛠️ Añadir Nuevo Contenido</h3>
              <input type="text" id="new-title" style="padding:8px; background:#080711; border:1px solid var(--border-color); border-radius:8px; color:#fff;" placeholder="Nombre del juego/cómic..." />
              <input type="text" id="new-icon" style="padding:8px; background:#080711; border:1px solid var(--border-color); border-radius:8px; color:#fff;" placeholder="Emoji Icono (ej: 🐉)" />
              <input type="text" id="new-url" style="padding:8px; background:#080711; border:1px solid var(--border-color); border-radius:8px; color:#fff;" placeholder="URL (https://...)" />
              <button class="btn-main" onclick="addNewCustomItem()">➕ Guardar en mi App</button>
            </div>
          `;
        }
      }
    }

    function switchNav(tab, el) {
      currentTab = tab;
      document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
      el.classList.add('active');
      renderView();
    }

    function openContent(url, title) {
      activeUrl = url;
      document.getElementById('modal-title').innerText = title;
      document.getElementById('modal-body-content').innerHTML = `<iframe src="${url}" allow="autoplay; encrypted-media; fullscreen"></iframe>`;
      document.getElementById('game-modal').classList.add('active');
    }

    function openModel3D(modelUrl, title) {
      activeUrl = modelUrl;
      document.getElementById('modal-title').innerText = title;
      document.getElementById('modal-body-content').innerHTML = `
        <model-viewer src="${modelUrl}" camera-controls auto-rotate shadow-intensity="1" ar style="background-color: #080711;"></model-viewer>
      `;
      document.getElementById('game-modal').classList.add('active');
    }

    function launchExternal() {
      if (activeUrl) {
        window.open(activeUrl, '_blank');
      }
    }

    function closeModal() {
      document.getElementById('game-modal').classList.remove('active');
      document.getElementById('modal-body-content').innerHTML = '';
    }

    function addNewCustomItem() {
      const title = document.getElementById('new-title').value;
      const icon = document.getElementById('new-icon').value || '🎮';
      const url = document.getElementById('new-url').value;

      if (!title || !url) return alert('¡Escribe al menos el título y la URL!');

      gamesList.unshift({ name: title, icon: icon, url: url, desc: 'Añadido manualmente' });
      alert('¡Añadido con éxito!');
      switchNav('juegos', document.querySelectorAll('.nav-item')[1]);
    }

    // Inicialización
    renderView();
  </script>
</body>
</html>
