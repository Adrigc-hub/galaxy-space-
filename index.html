<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Cosmic Play Store & GameSpace</title>
  <link rel="manifest" href="manifest.json" />
  <style>
    :root {
      --bg-dark: #0f0f15;
      --bg-card: #181824;
      --accent-blue: #01875f; /* Color oficial Play Store */
      --accent-cyan: #00f0ff;
      --accent-purple: #8ab4f8;
      --text-main: #ffffff;
      --text-dim: #9aa0a6;
      --border-color: rgba(255, 255, 255, 0.1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Roboto', 'Segoe UI', system-ui, sans-serif;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* BARRA SUPERIOR PLAY STORE */
    .store-header {
      padding: 12px 16px 8px;
      background: #1f1f2e;
      display: flex;
      flex-direction: column;
      gap: 12px;
      border-bottom: 1px solid var(--border-color);
      z-index: 10;
    }

    .search-bar-container {
      display: flex;
      align-items: center;
      background: #2c2c3e;
      border-radius: 28px;
      padding: 6px 16px;
      gap: 12px;
    }

    .search-input {
      flex: 1;
      background: transparent;
      border: none;
      color: #fff;
      font-size: 15px;
      outline: none;
    }

    .profile-avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: linear-gradient(135deg, #a855f7, #3b82f6);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 14px;
    }

    /* PESTAÑAS DE CATEGORÍA SUPERIOR */
    .top-categories {
      display: flex;
      gap: 20px;
      overflow-x: auto;
      scrollbar-width: none;
      padding-bottom: 4px;
    }
    .top-categories::-webkit-scrollbar { display: none; }

    .cat-pill {
      font-size: 14px;
      color: var(--text-dim);
      white-space: nowrap;
      cursor: pointer;
      padding-bottom: 4px;
      border-bottom: 2px solid transparent;
    }

    .cat-pill.active {
      color: var(--accent-purple);
      border-bottom-color: var(--accent-purple);
      font-weight: bold;
    }

    /* CONTENIDO PRINCIPAL SCROLLABLE */
    .main-content {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      padding-bottom: 80px;
    }

    .section-title {
      font-size: 17px;
      font-weight: bold;
      margin: 18px 0 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    /* CARDS DE JUEGOS Y APPS */
    .horizontal-scroll {
      display: flex;
      gap: 14px;
      overflow-x: auto;
      scrollbar-width: none;
      padding-bottom: 8px;
    }
    .horizontal-scroll::-webkit-scrollbar { display: none; }

    .app-card-vert {
      width: 110px;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      gap: 8px;
      cursor: pointer;
    }

    .app-icon {
      width: 110px;
      height: 110px;
      border-radius: 22px;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 42px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
      overflow: hidden;
    }

    .app-icon img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .app-title {
      font-size: 13px;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .app-meta {
      font-size: 11px;
      color: var(--text-dim);
    }

    /* NAVEGACIÓN INFERIOR ESTILO GOOGLE PLAY */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 65px;
      background: #181824;
      display: flex;
      justify-content: space-around;
      align-items: center;
      border-top: 1px solid var(--border-color);
      z-index: 100;
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      color: var(--text-dim);
      font-size: 11px;
      cursor: pointer;
      width: 20%;
    }

    .nav-item.active {
      color: var(--accent-purple);
      font-weight: bold;
    }

    .nav-icon {
      font-size: 20px;
      padding: 4px 16px;
      border-radius: 16px;
    }

    .nav-item.active .nav-icon {
      background: rgba(138, 180, 248, 0.2);
    }

    /* BOTONES ACCIÓN */
    .btn-install {
      background: var(--accent-blue);
      color: #fff;
      border: none;
      padding: 6px 16px;
      border-radius: 18px;
      font-size: 12px;
      font-weight: bold;
      cursor: pointer;
    }

    /* MODAL DEL CREADOR DE JUEGOS */
    .creator-form {
      background: var(--bg-card);
      padding: 20px;
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      border: 1px solid var(--border-color);
    }

    .input-field, textarea {
      width: 100%;
      background: #0d0d14;
      border: 1px solid var(--border-color);
      padding: 10px 14px;
      border-radius: 8px;
      color: #fff;
      font-size: 14px;
      outline: none;
    }

    /* VENTANA DEL JUEGO */
    .game-modal {
      position: fixed;
      inset: 0;
      background: #000;
      z-index: 99999;
      display: none;
      flex-direction: column;
    }

    .game-modal.active {
      display: flex;
    }

    .game-header {
      height: 48px;
      background: #181824;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 16px;
    }

    iframe {
      flex: 1;
      border: none;
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>

  <!-- BARRA SUPERIOR CON BUSCADOR -->
  <div class="store-header">
    <div class="search-bar-container">
      <span style="color: var(--text-dim);">🔍</span>
      <input type="text" id="global-search" class="search-input" placeholder="Buscar juegos, apps, libros..." oninput="filterContent()" />
      <div class="profile-avatar">A</div>
    </div>

    <div class="top-categories">
      <span class="cat-pill active">Para ti</span>
      <span class="cat-pill">Listas de éxitos</span>
      <span class="cat-pill">Infantiles</span>
      <span class="cat-pill">Premium</span>
    </div>
  </div>

  <!-- CONTENIDO PRINCIPAL DINÁMICO -->
  <div class="main-content" id="main-view">
    <!-- Se genera con JavaScript -->
  </div>

  <!-- NAVEGACIÓN INFERIOR NATIVA -->
  <div class="bottom-nav">
    <div class="nav-item active" onclick="switchNav('juegos', this)">
      <div class="nav-icon">🎮</div>
      <span>Juegos</span>
    </div>
    <div class="nav-item" onclick="switchNav('apps', this)">
      <div class="nav-icon">📱</div>
      <span>Apps</span>
    </div>
    <div class="nav-item" onclick="switchNav('buscar', this)">
      <div class="nav-icon">🔍</div>
      <span>Buscar</span>
    </div>
    <div class="nav-item" onclick="switchNav('libros', this)">
      <div class="nav-icon">📚</div>
      <span>Libros</span>
    </div>
    <div class="nav-item" onclick="switchNav('creador', this)">
      <div class="nav-icon">🛠️</div>
      <span>Creador</span>
    </div>
  </div>

  <!-- MODAL PARA JUGAR -->
  <div class="game-modal" id="game-modal">
    <div class="game-header">
      <span id="modal-game-title" style="font-weight: bold;">Juego</span>
      <button onclick="closeGame()" style="background: #ff0055; color: white; border: none; padding: 6px 14px; border-radius: 12px; font-weight: bold;">✕ Salir</button>
    </div>
    <iframe id="game-iframe" src=""></iframe>
  </div>

  <script>
    // BASE DE DATOS DE JUEGOS Y LIBROS (+1000 SIMULADOS CON CATEGORÍAS)
    let gamesList = [
      { id: 'tetris', name: 'Tetris Cube 3D', icon: '🧩', rating: '4.8 ⭐', type: 'juegos', desc: 'El clásico Tetris optimizado para móvil.', url: 'https://tetris.com/play-tetris' },
      { id: 'pacman', name: 'Pac-Man Retro', icon: '🟡', rating: '4.7 ⭐', type: 'juegos', desc: 'Esquiva fantasmas en el espacio.', url: 'https://freepacman.org/' },
      { id: '2048', name: '2048 Cosmic', icon: '🔢', rating: '4.9 ⭐', type: 'juegos', desc: 'Juego de números y lógica.', url: 'https://play2048.co/' },
      { id: 'snake', name: 'Space Snake', icon: '🐍', rating: '4.5 ⭐', type: 'juegos', desc: 'La serpiente espacial clásica.', url: 'https://playsnake.org/' },
      { id: 'clash', name: 'Clash Royale Web', icon: '👑', rating: '4.6 ⭐', type: 'juegos', desc: 'Estrategia en tiempo real.', url: 'https://play2048.co/' }
    ];

    let booksList = [
      { id: 'b1', name: 'Imperio de Roca', icon: '📖', price: 'USD 0.06', desc: 'Cómic de ciencia ficción.' },
      { id: 'b2', name: 'Heartstopper', icon: '📚', price: 'USD 14.99', desc: 'Novela gráfica.' },
      { id: 'b3', name: 'Iron Man: Extremis', icon: '📕', price: 'USD 10.99', desc: 'Cómic Marvel Oficial.' },
      { id: 'b4', name: 'El Poder del Ahora', icon: '📘', price: 'USD 11.99', desc: 'Libro de superación personal.' }
    ];

    let currentTab = 'juegos';

    function renderView() {
      const container = document.getElementById('main-view');
      const searchVal = document.getElementById('global-search').value.toLowerCase();

      if (currentTab === 'juegos' || currentTab === 'apps') {
        const filtered = gamesList.filter(g => g.name.toLowerCase().includes(searchVal));
        
        container.innerHTML = `
          <div class="section-title">
            <span>Recomendados para ti</span>
            <span style="font-size:12px; color:var(--accent-purple);">Ver todo</span>
          </div>
          <div class="horizontal-scroll">
            ${filtered.map(g => `
              <div class="app-card-vert" onclick="playGame('${g.url}', '${g.name}')">
                <div class="app-icon">${g.icon}</div>
                <div class="app-title">${g.name}</div>
                <div class="app-meta">${g.rating}</div>
              </div>
            `).join('')}
          </div>

          <div class="section-title">
            <span>Juegos populares</span>
          </div>
          <div style="display: flex; flex-direction: column; gap: 12px;">
            ${filtered.map(g => `
              <div style="display:flex; align-items:center; justify-content:space-between; background:var(--bg-card); padding:10px; border-radius:14px;" onclick="playGame('${g.url}', '${g.name}')">
                <div style="display:flex; align-items:center; gap:12px;">
                  <div class="app-icon" style="width:50px; height:50px; font-size:24px;">${g.icon}</div>
                  <div>
                    <div style="font-weight:bold; font-size:14px;">${g.name}</div>
                    <div style="font-size:11px; color:var(--text-dim);">${g.desc}</div>
                  </div>
                </div>
                <button class="btn-install">Jugar</button>
              </div>
            `).join('')}
          </div>
        `;
      } else if (currentTab === 'libros') {
        const filteredB = booksList.filter(b => b.name.toLowerCase().includes(searchVal));
        container.innerHTML = `
          <div class="section-title"><span>Cómics y Libros más vendidos</span></div>
          <div class="horizontal-scroll">
            ${filteredB.map(b => `
              <div class="app-card-vert">
                <div class="app-icon" style="background:#281c36;">${b.icon}</div>
                <div class="app-title">${b.name}</div>
                <div class="app-meta" style="color:#00f0ff;">${b.price}</div>
              </div>
            `).join('')}
          </div>
        `;
      } else if (currentTab === 'creador') {
        container.innerHTML = `
          <div class="creator-form">
            <h2>🛠️ Creador de Juegos HTML5</h2>
            <p style="font-size:12px; color:var(--text-dim);">Crea tu propio juego introduciendo la URL o tu propio código HTML:</p>
            <input type="text" id="new-name" class="input-field" placeholder="Nombre del juego..." />
            <input type="text" id="new-icon" class="input-field" placeholder="Icono Emoji (ej: 🚀)" />
            <input type="text" id="new-url" class="input-field" placeholder="URL del juego (https://...)" />
            <button class="btn-install" style="padding:12px; font-size:14px;" onclick="createNewGame()">🚀 Publicar en mi Play Store</button>
          </div>
        `;
      } else if (currentTab === 'buscar') {
        container.innerHTML = `
          <div style="text-align:center; padding:40px 20px;">
            <h3>🔍 Buscador Global</h3>
            <p style="color:var(--text-dim); font-size:13px; margin-top:8px;">Escribe arriba en el buscador para filtrar juegos y libros instantáneamente.</p>
          </div>
        `;
      }
    }

    function switchNav(tab, el) {
      currentTab = tab;
      document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
      el.classList.add('active');
      renderView();
    }

    function filterContent() {
      renderView();
    }

    function createNewGame() {
      const name = document.getElementById('new-name').value;
      const icon = document.getElementById('new-icon').value || '🎮';
      const url = document.getElementById('new-url').value;

      if (!name || !url) {
        alert('Por favor ingresa un nombre y una URL válida.');
        return;
      }

      gamesList.unshift({
        id: 'custom_' + Date.now(),
        name: name,
        icon: icon,
        rating: '5.0 ⭐',
        type: 'juegos',
        desc: 'Juego creado por el usuario.',
        url: url
      });

      alert('¡Juego creado y publicado con éxito!');
      switchNav('juegos', document.querySelectorAll('.nav-item')[0]);
    }

    function playGame(url, title) {
      document.getElementById('modal-game-title').innerText = title;
      document.getElementById('game-iframe').src = url;
      document.getElementById('game-modal').classList.add('active');
    }

    function closeGame() {
      document.getElementById('game-modal').classList.remove('active');
      document.getElementById('game-iframe').src = '';
    }

    // Inicializar la vista
    renderView();
  </script>
</body>
</html>
