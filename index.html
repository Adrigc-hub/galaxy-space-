<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cosmic Space OS</title>
  <link rel="manifest" href="manifest.json" />
  <style>
    :root {
      --bg-image: radial-gradient(circle at 50% 50%, #101426 0%, #05070d 100%);
      --panel-bg: rgba(15, 20, 35, 0.7);
      --accent-cyan: #00f0ff;
      --accent-purple: #9d00ff;
      --accent-pink: #ff007f;
      --text-main: #ffffff;
      --text-dim: #8fa0b5;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      user-select: none;
    }

    body {
      background: var(--bg-image);
      background-size: cover;
      background-position: center;
      color: var(--text-main);
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: background 0.5s ease;
    }

    /* BARRA SUPERIOR Y NAVEGACIÓN */
    .top-bar {
      height: 60px;
      padding: 0 25px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(8, 10, 18, 0.85);
      backdrop-filter: blur(15px);
      border-bottom: 1px solid rgba(0, 240, 255, 0.2);
      z-index: 10;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      font-weight: 800;
      letter-spacing: 2px;
      color: var(--accent-cyan);
      text-shadow: 0 0 10px rgba(0, 240, 255, 0.5);
    }

    .nav-tabs {
      display: flex;
      gap: 10px;
      background: rgba(255, 255, 255, 0.05);
      padding: 5px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .tab-btn {
      background: transparent;
      color: var(--text-dim);
      border: none;
      padding: 8px 16px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .tab-btn.active, .tab-btn:hover {
      background: linear-gradient(135deg, var(--accent-cyan), var(--accent-purple));
      color: #fff;
      box-shadow: 0 0 15px rgba(0, 240, 255, 0.4);
    }

    /* CONTENEDOR PRINCIPAL */
    .view-container {
      flex: 1;
      padding: 20px;
      position: relative;
      overflow-y: auto;
    }

    .view-section {
      display: none;
      height: 100%;
      animation: fadeIn 0.4s ease-in-out forwards;
    }

    .view-section.active {
      display: flex;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* SECCIÓN GAMESPACE */
    .gamespace-layout {
      width: 100%;
      display: flex;
      gap: 20px;
    }

    .sidebar-games {
      width: 260px;
      background: var(--panel-bg);
      backdrop-filter: blur(15px);
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 15px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-height: 100%;
      overflow-y: auto;
    }

    .game-card {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.03);
      cursor: pointer;
      transition: all 0.25s ease;
      border: 1px solid transparent;
    }

    .game-card:hover, .game-card.active {
      background: rgba(0, 240, 255, 0.15);
      border-color: var(--accent-cyan);
      transform: translateX(5px);
    }

    .game-icon {
      width: 45px;
      height: 45px;
      border-radius: 10px;
      background: #222;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }

    .game-display {
      flex: 1;
      background: var(--panel-bg);
      backdrop-filter: blur(15px);
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 35px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
    }

    /* TIENDA (PLAY STORE) */
    .grid-store {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 20px;
      width: 100%;
    }

    .store-item {
      background: var(--panel-bg);
      backdrop-filter: blur(15px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      padding: 20px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      transition: transform 0.3s;
    }

    .store-item:hover {
      transform: translateY(-5px);
      border-color: var(--accent-purple);
    }

    /* FONDOS DE PANTALLA */
    .grid-wallpapers {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 20px;
      width: 100%;
    }

    .wp-card {
      height: 130px;
      border-radius: 14px;
      cursor: pointer;
      border: 2px solid transparent;
      transition: all 0.3s;
      background-size: cover;
      background-position: center;
      display: flex;
      align-items: flex-end;
      padding: 10px;
      font-weight: bold;
      text-shadow: 0 2px 4px #000;
    }

    .wp-card:hover {
      border-color: var(--accent-cyan);
      transform: scale(1.03);
    }

    /* AJUSTES */
    .settings-card {
      background: var(--panel-bg);
      backdrop-filter: blur(15px);
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 30px;
      max-width: 500px;
      width: 100%;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .input-field {
      width: 100%;
      padding: 12px 16px;
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 10px;
      color: white;
      font-size: 15px;
      outline: none;
    }

    .input-field:focus {
      border-color: var(--accent-cyan);
      box-shadow: 0 0 10px rgba(0, 240, 255, 0.3);
    }

    .btn-action {
      background: linear-gradient(135deg, var(--accent-cyan), var(--accent-purple));
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 10px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-action:hover {
      opacity: 0.9;
      transform: scale(1.02);
    }

    /* PANTALLA DE BLOQUEO DE PRIVACIDAD */
    .privacy-overlay {
      position: fixed;
      inset: 0;
      background: rgba(5, 7, 13, 0.88);
      backdrop-filter: blur(30px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    .privacy-overlay.active {
      opacity: 1;
      pointer-events: all;
    }

    .lock-box {
      background: rgba(18, 24, 40, 0.95);
      padding: 35px;
      border-radius: 24px;
      border: 1px solid rgba(0, 240, 255, 0.3);
      box-shadow: 0 0 30px rgba(0, 240, 255, 0.2);
      text-align: center;
      width: 320px;
    }
  </style>
</head>
<body>

  <!-- TOP BAR -->
  <div class="top-bar">
    <div class="brand">
      <span>🛸 COSMIC OS</span>
    </div>
    <div class="nav-tabs">
      <button class="tab-btn active" onclick="switchTab('gamespace')">🎮 GameSpace</button>
      <button class="tab-btn" onclick="switchTab('store')">🛍️ PlayStore</button>
      <button class="tab-btn" onclick="switchTab('wallpapers')">🖼️ Fondos</button>
      <button class="tab-btn" onclick="switchTab('settings')">⚙️ Ajustes</button>
    </div>
  </div>

  <!-- VISTAS / SECCIONES -->
  <div class="view-container">

    <!-- 1. GAMESPACE (SÓLO JUEGOS INSTALADOS) -->
    <div id="gamespace" class="view-section gamespace-layout active">
      <div class="sidebar-games" id="installed-list">
        <!-- Se llena dinámicamente -->
      </div>
      <div class="game-display">
        <div>
          <h1 id="selected-title" style="font-size: 40px; text-transform: uppercase;">Sin Juegos</h1>
          <p id="selected-desc" style="color: var(--text-dim); margin-top: 10px;">Instala juegos desde la PlayStore para jugarlos aquí de forma aislada.</p>
        </div>
        <div>
          <button class="btn-action" id="launch-btn" onclick="launchGame()" style="display:none;">▶ Iniciar Juego</button>
        </div>
      </div>
    </div>

    <!-- 2. TIENDA (PLAY STORE) -->
    <div id="store" class="view-section">
      <div class="grid-store" id="store-list">
        <!-- Se llena dinámicamente -->
      </div>
    </div>

    <!-- 3. FONDOS DE PANTALLA -->
    <div id="wallpapers" class="view-section">
      <div class="grid-wallpapers">
        <div class="wp-card" style="background-image: radial-gradient(circle at 50% 50%, #101426 0%, #05070d 100%);" onclick="setWallpaper('radial-gradient(circle at 50% 50%, #101426 0%, #05070d 100%)')">Vaciado Oscuro</div>
        <div class="wp-card" style="background-image: linear-gradient(135deg, #1f0036 0%, #000000 100%);" onclick="setWallpaper('linear-gradient(135deg, #1f0036 0%, #000000 100%)')">Nebulosa Violeta</div>
        <div class="wp-card" style="background-image: linear-gradient(135deg, #002b36 0%, #000508 100%);" onclick="setWallpaper('linear-gradient(135deg, #002b36 0%, #000508 100%)')">Ciber Cian</div>
        <div class="wp-card" style="background-image: linear-gradient(135deg, #360012 0%, #0a0004 100%);" onclick="setWallpaper('linear-gradient(135deg, #360012 0%, #0a0004 100%)')">Supernova Roja</div>
      </div>
    </div>

    <!-- 4. AJUSTES -->
    <div id="settings" class="view-section">
      <div class="settings-card">
        <h2>⚙️ Configuración del Sistema</h2>
        <div>
          <label style="display:block; margin-bottom: 8px; color: var(--text-dim);">Cambiar Contraseña de Privacidad</label>
          <input type="password" id="new-pin" class="input-field" placeholder="Nueva Contraseña" />
        </div>
        <button class="btn-action" onclick="savePassword()">Guardar Contraseña</button>
        <hr style="border-color: rgba(255,255,255,0.1);" />
        <div>
          <p style="color: var(--text-dim); font-size: 13px; margin-bottom: 10px;">Instalación de Aplicación:</p>
          <button class="btn-action" id="install-pwa-btn" style="width: 100%;">📥 Instalar como App / APK</button>
        </div>
      </div>
    </div>

  </div>

  <!-- PANTALLA DE BLOQUEO POR PRIVACIDAD -->
  <div class="privacy-overlay" id="privacy-overlay">
    <div class="lock-box">
      <h2 style="margin-bottom: 10px;">🔒 Espacio Bloqueado</h2>
      <p style="font-size: 13px; color: var(--text-dim); margin-bottom: 15px;">Ingresa la contraseña para acceder</p>
      <input type="password" id="pin-input" class="input-field" placeholder="••••" style="text-align: center; margin-bottom: 15px;" />
      <button class="btn-action" style="width: 100%;" onclick="unlockScreen()">Desbloquear</button>
    </div>
  </div>

  <script>
    // ESTADO DE LA APP
    let systemPin = localStorage.getItem('cosmic_pin') || "1234";
    let installedGames = JSON.parse(localStorage.getItem('cosmic_games')) || [];
    let selectedGame = null;

    const storeCatalog = [
      { id: 'fn', name: 'Fortnite', icon: '⚡', desc: 'Batalla real en la isla flotante aislada.' },
      { id: 'tr', name: 'Terraria', icon: '🗡️', desc: 'Explora, construye y lucha en mundos 2D.' },
      { id: 'rb', name: 'Roblox', icon: '🧱', desc: 'Universo virtual para crear y jugar.' },
      { id: 'cr', name: 'Clash Royale', icon: '👑', desc: 'Estrategia en tiempo real con cartas.' },
      { id: 'mc', name: 'Minecraft', icon: '🟩', desc: 'Mundo infinito de bloques y construcción.' }
    ];

    // CAMBIO DE PESTAÑAS
    function switchTab(tabId) {
      document.querySelectorAll('.view-section').forEach(sec => sec.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));

      document.getElementById(tabId).classList.add('active');
      event.currentTarget.classList.add('active');
    }

    // RENDERIZAR TIENDA
    function renderStore() {
      const container = document.getElementById('store-list');
      container.innerHTML = storeCatalog.map(game => {
        const isInstalled = installedGames.some(g => g.id === game.id);
        return `
          <div class="store-item">
            <div class="game-icon" style="width:60px; height:60px; font-size:30px;">${game.icon}</div>
            <h3>${game.name}</h3>
            <p style="font-size:12px; color:var(--text-dim);">${game.desc}</p>
            <button class="btn-action" onclick="toggleInstall('${game.id}')" style="width:100%; margin-top:auto;">
              ${isInstalled ? 'Desinstalar' : 'Instalar'}
            </button>
          </div>
        `;
      }).join('');
    }

    // INSTALAR / DESINSTALAR JUEGO
    function toggleInstall(gameId) {
      const exists = installedGames.some(g => g.id === gameId);
      if (exists) {
        installedGames = installedGames.filter(g => g.id !== gameId);
      } else {
        const game = storeCatalog.find(g => g.id === gameId);
        installedGames.push(game);
      }
      localStorage.setItem('cosmic_games', JSON.stringify(installedGames));
      renderStore();
      renderGamespace();
    }

    // RENDERIZAR GAMESPACE
    function renderGamespace() {
      const listContainer = document.getElementById('installed-list');
      if (installedGames.length === 0) {
        listContainer.innerHTML = '<p style="color:var(--text-dim); text-align:center; padding:20px;">No hay juegos en el espacio.</p>';
        document.getElementById('selected-title').innerText = 'Sin Juegos';
        document.getElementById('selected-desc').innerText = 'Instala juegos desde la PlayStore para jugarlos aquí de forma aislada.';
        document.getElementById('launch-btn').style.display = 'none';
        return;
      }

      listContainer.innerHTML = installedGames.map(game => `
        <div class="game-card" onclick="selectGame('${game.id}')">
          <div class="game-icon">${game.icon}</div>
          <span style="font-weight:bold;">${game.name}</span>
        </div>
      `).join('');

      // Seleccionar el primero por defecto
      if (!selectedGame || !installedGames.some(g => g.id === selectedGame.id)) {
        selectGame(installedGames[0].id);
      }
    }

    function selectGame(gameId) {
      selectedGame = installedGames.find(g => g.id === gameId);
      if (selectedGame) {
        document.getElementById('selected-title').innerText = selectedGame.name;
        document.getElementById('selected-desc').innerText = selectedGame.desc + ' (Entorno aislado protegido)';
        document.getElementById('launch-btn').style.display = 'inline-block';
      }
    }

    function launchGame() {
      if (selectedGame) {
        alert('Ejecutando ' + selectedGame.name + ' dentro del espacio simulado.');
      }
    }

    // FONDO DE PANTALLA
    function setWallpaper(bgCss) {
      document.body.style.background = bgCss;
      document.body.style.backgroundSize = 'cover';
    }

    // CONTRASEÑA Y PRIVACIDAD
    function savePassword() {
      const newPin = document.getElementById('new-pin').value.trim();
      if (newPin.length > 0) {
        systemPin = newPin;
        localStorage.setItem('cosmic_pin', systemPin);
        alert('Contraseña actualizada con éxito.');
        document.getElementById('new-pin').value = '';
      } else {
        alert('Escribe una contraseña válida.');
      }
    }

    window.addEventListener('blur', () => {
      document.getElementById('privacy-overlay').classList.add('active');
    });

    function unlockScreen() {
      const enteredPin = document.getElementById('pin-input').value;
      if (enteredPin === systemPin) {
        document.getElementById('privacy-overlay').classList.remove('active');
        document.getElementById('pin-input').value = '';
      } else {
        alert('Contraseña incorrecta.');
        document.getElementById('pin-input').value = '';
      }
    }

    // PWA / INSTALACIÓN TIPO APK
    let deferredPrompt;
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      document.getElementById('install-pwa-btn').onclick = () => {
        deferredPrompt.prompt();
      };
    });

    // INICIALIZACIÓN
    renderStore();
    renderGamespace();
  </script>
</body>
</html>
